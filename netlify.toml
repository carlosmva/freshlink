[build]
  command = "npm run build"
  publish = "dist/freshlink/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npx ng serve --port 4200"
  targetPort = 4200
  port = 8888
  framework = "#custom"
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  included_files = ["db/seed.sql", "db/reset-demo.cjs"]
