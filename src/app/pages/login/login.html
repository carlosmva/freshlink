<fl-site-nav>
  <a class="back" routerLink="/">
    <fl-icon name="arrow-left" />
    All portals
  </a>
</fl-site-nav>

<main class="page">
  <section class="card">
    <header class="intro">
      <p class="eyebrow">{{ copy.eyebrow }}</p>
      <h1>{{ copy.title }}</h1>
      <p class="lede">{{ copy.body }}</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="fields">
        <label>
          Email
          <input type="email" formControlName="email" autocomplete="username" [attr.placeholder]="copy.email" />
        </label>
        <label>
          Password
          <span class="password-field">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="reveal"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              [attr.aria-pressed]="showPassword()"
            >
              <fl-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
            </button>
          </span>
        </label>
      </div>

      @if (siteKey()) {
        <div class="turnstile-wrap">
          <fl-turnstile [siteKey]="siteKey()" (token)="onTurnstile($event)" />
          @if (turnstileMode() === 'dev') {
            <p class="dev-note">Dev login uses Cloudflare’s dummy Turnstile widget. Production uses the live site keys.</p>
          }
        </div>
      }

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="submit" [disabled]="blocked()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</main>
